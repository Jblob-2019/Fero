<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('favorites-grid');

    const showEmptyState = () => {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:56px 20px;">
          <span style="font-size:44px;display:block;margin-bottom:14px;">🔖</span>
          <h3 style="font-size:24px;margin-bottom:8px;">No Saved Destinations Yet</h3>
          <p style="color:var(--ink-muted);font-size:15px;margin-bottom:24px;max-width:36ch;margin-left:auto;margin-right:auto;">Tap the bookmark icon on any destination card to save places for your next trip.</p>
          <a href="explore.html" class="btn btn-primary" style="display:inline-flex;">Browse Destinations</a>
        </div>`;
    };

    const renderFavs = () => {
      if (!window.allDestinations) {
        setTimeout(renderFavs, 80);
        return;
      }
      const favs = loadFavorites();
      const favDestinations = window.allDestinations.filter(d => favs.includes(String(d.id)));
      if (favDestinations.length === 0) {
        showEmptyState();
      } else {
        if (typeof window.createFeaturedCard === 'function') {
          grid.innerHTML = favDestinations.map(window.createFeaturedCard).join('');
          if (window.attachFavoriteHandlers) window.attachFavoriteHandlers(grid);
          if (window.attachCardClickHandlers) window.attachCardClickHandlers(grid);
        }
      }
    };

    // Animate removal if user un-saves a card directly on this page
    if (grid) {
      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('.bookmark-btn');
        if (btn) {
          setTimeout(() => {
            if (!btn.classList.contains('on')) {
              const card = btn.closest('.dest-card');
              if (card) {
                card.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                  card.remove();
                  if (grid.querySelectorAll('.dest-card').length === 0) {
                    showEmptyState();
                  }
                }, 250);
              }
            }
          }, 50);
        }
      });
    }

    renderFavs();
  });
</script>
